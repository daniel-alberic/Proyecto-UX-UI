<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="css/sebas.css">
    <header class="encabezado">
        <div class="logo">
            <img src="image/kovara.jpg" alt="Logo Kovara Automotriz">
        </div>
        <nav class="menu">
            <ul>
                <li><a href="#">INICIO</a></li>
                <li><a href="#">CONTACTOS</a></li>
                <li><a href="#">MARCAS</a></li>
                <li><a href="#">REGISTRO</a></li>
                <li><a href="#">NOSOTROS</a></li>
                <li><a href="#">ACCESORIOS</a></li>
            </ul>
        </nav>
    </header>

    <main class="principal">
        <section class="titulo-seccion">
            <h1>NUESTRAS SEDES</h1>
            <a href="#" class="subtitulo-enlace">Encuentra nuestra sede mas cercana</a>
        </section>

        <section class="contenido-sede">
            <div class="imagen-k">
                <img src="image/kovara1.jpg" alt="Logo K Kovara">
            </div>

            <div class="info-sede">
                <h2>Sede Lima</h2>
                
                <div class="dato-sede">
                    <img src="image/marcador (2) (1).png" alt="Ubicación" class="icono">
                    <p>Av. Panamericana Norte, Senati Independencia</p>
                </div>

                <div class="dato-sede">
                    <img src="image/reloj-tres (2) (1).png" alt="Horario" class="icono">
                    <p>Lun - Dom: 8:00am a 8:00pm</p>
                </div>

                <a href="#" class="btn-llegar">COMO LLEGAR</a>
            </div>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="logo-footer">
            <img src="image/kovara.jpg" alt="Logo Kovara Automotriz">
        </div>
        <div class="redes-sociales">
            <a href="#"><img src="image/facebook (1).png" alt="Facebook"></a>
            <a href="#"><img src="image/instagram (1).png" alt="Instagram"></a>
            <a href="#"><img src="image/youtube (2) (1).png" alt="YouTube"></a>
        </div>
    </footer>

</body>
</html>
